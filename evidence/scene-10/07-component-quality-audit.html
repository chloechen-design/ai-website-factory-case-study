<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Rapport SOP 07A — source complète</title>
    <style>
      :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202a39; background: #f4f6f9; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: clamp(18px, 4vw, 48px); }
      main { width: min(100%, 1040px); margin: 0 auto; padding: clamp(20px, 4vw, 40px); border: 1px solid #dce3ed; border-radius: 16px; background: #fff; }
      h1 { margin: 0 0 10px; font-size: clamp(24px, 3vw, 36px); line-height: 1.12; }
      p { color: #637187; line-height: 1.55; }
      a { color: #355f95; }
      pre { max-height: none; overflow: auto; margin: 24px 0 0; padding: 20px; border: 1px solid #dce3ed; border-radius: 10px; background: #fafbfd; color: #202a39; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 600px) { body { padding: 10px; } main { padding: 18px 14px; } pre { padding: 12px; font-size: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Rapport complet — SOP 07A</h1>
      <p>Transcription affichée depuis le fichier Markdown source, sans réécriture. Ce rapport est postérieur à SOP 05 et ne constitue pas une preuve de cet audit.</p>
      <a href="./07-component-quality-audit.md" download>Télécharger le fichier Markdown source</a>
      <pre id="report" aria-live="polite">Chargement du document…</pre>
    </main>
    <script type="module">
      const report = document.querySelector("#report");
      try {
        const response = await fetch("./07-component-quality-audit.md");
        if (!response.ok) throw new Error(`Réponse HTTP ${response.status}`);
        report.textContent = await response.text();
      } catch (error) {
        report.textContent = `Le rapport source n’a pas pu être chargé. ${error.message}`;
      }
    </script>
  </body>
</html>
